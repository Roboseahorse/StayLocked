[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hardlock"
version = "1.5.0"
description = "Free open-source focus tool – whitelist-based application locker"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "AstroLabs-UK (original)", email = "" }]
dependencies = [
    "customtkinter>=5.2.0",
    "psutil>=5.9.0",
    "plyer>=2.1.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
windows = ["pywin32"]
dev = ["pytest", "pyinstaller"]

[project.scripts]
hardlock = "hardlock.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["hardlock*"]
